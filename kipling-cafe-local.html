<script>
/* LOCAL TEST SHIM: lets this page run outside Claude. Open index.html for the customer view, index.html#owner for the owner dashboard. */
if(!window.claude){(function(){
var owner=location.hash==='#owner',S={};try{S=JSON.parse(localStorage.getItem('kc_db')||'{}')}catch(e){}
var save=function(){try{localStorage.setItem('kc_db',JSON.stringify(S))}catch(e){}};
var db={collection:function(n){return{
add:async function(d){(S[n]=S[n]||[]).push(d);save()},
where:function(f,o,v){return{get:async function(){var a=(S[n]||[]).filter(function(d){return d[f]>=v});return{forEach:function(fn){a.forEach(function(d){fn({data:function(){return d}})})}}}}}}}};
var mods={
user:{canEdit:function(){return owner},isOwner:function(){return owner}},
db:db,
assets:{upload:function(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res({url:r.result})};r.onerror=rej;r.readAsDataURL(file)})}},
artifact:{publish:async function(html){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove()}}};
window.claude={use:async function(n){return mods[n]||null}};
window.addEventListener('hashchange',function(){location.reload()});
})()}
</script>
<script>
let D=JSON.parse(document.getElementById('data').textContent);
let owner=false,view='home',cart={},fc=(D.menu[0]||{}).cat||'All',q='',dirty=false,bills=[],cust={name:'',table:''};
const $=s=>document.querySelector(s),app=$('#app');
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>Math.round(n*100)/100,money=n=>D.cur+R(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pm=m=>m.price>0?D.cur+m.price:'Ask staff';
const toast=t=>{$('#toast').textContent=t;setTimeout(()=>$('#toast').textContent='',2600)};
const cats=()=>[...new Set(D.menu.map(m=>m.cat))];
const mapUrl=()=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.name+' '+D.addr);
const ico=c=>{c=c.toLowerCase();return([['soup','🍲'],['salad','🥗'],['pizza','🍕'],['pasta','🍝'],['dessert','🍰'],['beverage','🥤'],['bread','🫓'],['noodle','🍜'],['tandoor','🍢'],['gravy','🍛'],['thai','🍛'],['starter','🍟']].find(x=>c.includes(x[0]))||[0,'🍽️'])[1]};
const mg=()=>{const s=q.toLowerCase();return D.menu.filter(m=>(fc==='All'||m.cat===fc)&&(!s||(m.name+' '+m.cat).toLowerCase().includes(s))).map(m=>card(m)).join('')||'<p class="mu">No dishes found.</p>'};
const card=(m,x='')=>`<div class="c"><div class="im" style="${m.img?`background-image:url('${h(m.img)}')`:''}">${m.img?'':ico(m.cat)}</div><div class="t"><b><span class="dot ${m.nv?'nv':''}"></span>${h(m.name)}</b><div class="mu">${h(m.desc)}</div><div class="pr">${pm(m)}</div>${x}</div></div>`;
const media=g=>g.t==='vid'?`<video src="${h(g.u)}" controls preload="metadata" playsinline></video>`:`<img src="${h(g.u)}" alt="" loading="lazy">`;
function home(){const cs=['All',...cats()];
return `<div class="hero" style="${D.hero?`background-image:linear-gradient(rgba(8,20,34,.2),rgba(8,20,34,.8)),url('${h(D.hero)}')`:''}"><h1>${h(D.name)}</h1><p>${h(D.tag)}</p><div class="row">
${D.reserveUrl?`<a class="b p" href="${h(D.reserveUrl)}" target="_blank" rel="noopener">Reserve a table</a>`:''}
<a class="b" href="tel:${h(D.phone)}">Call</a>${D.wa?`<a class="b" href="https://wa.me/${h(D.wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<a class="b" href="${mapUrl()}" target="_blank" rel="noopener">Directions</a></div></div>
<h2 id="menu">Menu</h2><div class="chips">${cs.map(c=>`<button class="b ${fc===c?'on':''}" data-fc="${h(c)}">${h(c)}</button>`).join('')}</div>
<input id="q" placeholder="Search the menu" value="${h(q)}" style="margin-bottom:10px"><div class="g" id="mg">${mg()}</div>
${D.gallery.length?`<h2>Gallery</h2><div class="gal">${D.gallery.map(media).join('')}</div>`:''}
<h2>Guest feedback</h2><div class="g">${D.reviews.map(r=>`<div class="c rv"><div class="st">${'★'.repeat(r.r)}${'☆'.repeat(5-r.r)}</div><div>${h(r.t)}</div><div class="mu">${h(r.n)}</div></div>`).join('')||'<p class="mu">Be the first to share your experience.</p>'}</div>
${D.feedUrl?`<div class="row"><a class="b d" href="${h(D.feedUrl)}" target="_blank" rel="noopener">Share your feedback</a></div>`:''}
<h2>Visit us</h2><div class="c rv"><b>${h(D.name)}</b><div>${h(D.addr)}</div><div class="mu">${h(D.hours)}</div><div class="row"><a class="b d" href="tel:${h(D.phone)}">${h(D.phone)}</a><a class="b" href="${mapUrl()}" target="_blank" rel="noopener">Open in Google Maps</a>${D.apptUrl?`<a class="b" href="${h(D.apptUrl)}" target="_blank" rel="noopener">Book an appointment</a>`:''}</div></div>`}
function menuEd(){return `<div class="row"><button class="b d" data-a="add">+ Add item</button></div><label>Bulk photos: name each file like the dish, e.g. biryani.jpg or margherita pizza.jpg. Matching dishes get the photo automatically.</label><input type="file" accept="image/*" multiple data-bulk="1"><div class="g one" style="margin-top:12px">${D.menu.map(m=>card(m,`<div class="ed">
<label>Name</label><input data-f="name" data-id="${m.id}" value="${h(m.name)}">
<div class="two"><div><label>Price (before GST)</label><input type="number" data-f="price" data-id="${m.id}" value="${m.price}"></div><div><label>GST %</label><select data-f="gst" data-id="${m.id}">${[0,5,12,18,28].map(r=>`<option ${m.gst==r?'selected':''}>${r}</option>`).join('')}</select></div></div>
<div class="two"><div><label>Category</label><input data-f="cat" data-id="${m.id}" value="${h(m.cat)}"></div><div><label>Type</label><select data-f="nv" data-id="${m.id}"><option value="0" ${m.nv?'':'selected'}>Veg</option><option value="1" ${m.nv?'selected':''}>Non-veg</option></select></div></div>
<label>Description</label><input data-f="desc" data-id="${m.id}" value="${h(m.desc)}">
<label>Photo</label><input type="file" accept="image/*" data-up="${m.id}"><button class="b" data-a="del" data-id="${m.id}" style="margin-top:8px">Remove</button></div>`)).join('')}</div>`}
function media_ed(){return `<label>Hero banner photo</label><input type="file" accept="image/*" data-hero="1"><label>Add photos or videos to gallery</label><input type="file" accept="image/*,video/*" multiple data-gal="1"><div class="gal" style="margin-top:12px">${D.gallery.map((g,i)=>`<div>${media(g)}<button class="b" data-a="gdel" data-id="${i}" style="margin-top:4px">Remove</button></div>`).join('')}</div>
<h2>Guest feedback shown on site</h2><div class="c rv"><div class="two"><div><label>Guest name</label><input id="rn"></div><div><label>Stars (1–5)</label><input id="rr" type="number" min="1" max="5" value="5"></div></div><label>Comment</label><textarea id="rt" rows="2"></textarea><button class="b d" data-a="radd" style="margin-top:8px">Add</button></div>
${D.reviews.map((r,i)=>`<div class="ln"><span>${'★'.repeat(r.r)} ${h(r.n)}: ${h(r.t)}</span><button data-a="rdel" data-id="${i}">×</button></div>`).join('')}`}
function settings(){const f=(k,l,t='text')=>`<label>${l}</label><input type="${t}" data-s="${k}" value="${h(D[k])}">`;
return `<div class="c rv">${f('name','Cafe name')}${f('tag','Tagline')}${f('phone','Phone (with country code)')}${f('wa','WhatsApp number (digits only, e.g. 917299030040)')}${f('addr','Address')}${f('hours','Opening hours')}${f('gstin','GSTIN (printed on bills)')}
${f('reserveUrl','Google Form link: table reservation')}${f('apptUrl','Google Form link: appointment')}${f('feedUrl','Google Form link: feedback')}
<p class="mu">Responses to Excel: open the form → Responses → link to Sheets → File → Download → Microsoft Excel (.xlsx).</p></div>`}
function calc(){const L=Object.keys(cart).filter(i=>cart[i]>0).map(i=>{const m=D.menu.find(x=>x.id===i),a=R(m.price*cart[i]);return{n:m.name,q:cart[i],p:m.price,a,g:m.gst}}),sl={};
L.forEach(l=>{sl[l.g]=(sl[l.g]||0)+l.a});const sub=R(L.reduce((s,l)=>s+l.a,0)),gs=Object.keys(sl).map(r=>({r:+r,base:sl[r],c:R(sl[r]*r/200)})),tax=R(gs.reduce((s,x)=>s+x.c*2,0));return{L,gs,sub,tax,tot:R(sub+tax)}}
function billing(){const b=calc(),tot=bills.reduce((s,x)=>s+x.total,0);
return `<p class="mu">Today: <b>${money(tot)}</b> from ${bills.length} bill(s)</p><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${D.menu.map(m=>`<button class="b" style="border-radius:12px;white-space:normal;text-align:left" data-a="add2" data-id="${m.id}">${h(m.name)}<br><span class="pr">${pm(m)}</span> <span class="mu">+${m.gst}%</span></button>`).join('')}</div>
<h2>Current bill</h2><div class="two"><div><label>Customer</label><input id="cn" value="${h(cust.name)}"></div><div><label>Table</label><input id="ct" value="${h(cust.table)}"></div></div>
${b.L.map(l=>`<div class="ln"><span>${h(l.n)} × ${l.q}</span><span><button data-a="dec" data-id="${D.menu.find(m=>m.name===l.n).id}">−</button> ${money(l.a)}</span></div>`).join('')||'<p class="mu">Tap items to add.</p>'}
<div class="ln"><span>Subtotal</span><span>${money(b.sub)}</span></div>${b.gs.filter(x=>x.r).map(x=>`<div class="ln mu"><span>CGST ${x.r/2}% + SGST ${x.r/2}% on ${money(x.base)}</span><span>${money(x.c*2)}</span></div>`).join('')}<div class="ln"><b>Total</b><b>${money(b.tot)}</b></div>
<div class="row"><button class="b d" data-a="paid">Save &amp; print</button><button class="b" data-a="clear">Clear</button></div>
<h2>Today’s bills</h2>${bills.map(x=>`<div class="ln"><span>${h(x.no)} ${h(x.cust||'')} ${x.table?'· T'+h(x.table):''}</span><span>${money(x.total)}</span></div>`).join('')||'<p class="mu">None yet.</p>'}`}
function render(){const tabs=[['home','Website'],['menu','Menu'],['media','Photos &amp; reviews'],['bill','Billing'],['set','Settings']];
app.innerHTML=`<div class="w"><div class="top"><div class="logo">${h(D.name)}</div>${owner?'':'<button class="link" data-a="own">Owner login</button>'}</div>
${dirty?'<div class="bar"><span>Unsaved changes</span><button class="b d" data-a="pub">Save &amp; publish</button></div>':''}

const c=document.documentElement.cloneNode(true);['#app','#inv','#toast'].forEach(s=>c.querySelector(s).innerHTML='');
c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
try{await a.publish('<!doctype html>\n'+c.outerHTML)}catch(e){toast(e.code==='conflict'?'Changed elsewhere. Reload.':'Publish failed')}}
async function loadBills(){try{const db=await claude.use('db');if(!db)return;const s=new Date();s.setHours(0,0,0,0);const q=await db.collection('bills').where('t','>=',s.getTime()).get();bills=[];q.forEach(d=>bills.push(d.data()));bills.sort((a,b)=>b.t-a.t)}catch(e){}}
async function up(file){const as=await claude.use('assets');if(!as)throw 0;return as.upload(file)}
function print(b,no){$('#inv').innerHTML=`<div style="text-align:center"><b style="font-size:16px">${h(D.name)}</b><br>${h(D.addr)}<br>${h(D.phone)}${D.gstin?'<br>GSTIN: '+h(D.gstin):''}</div><hr>Bill ${no} · ${new Date().toLocaleString('en-IN')}<br>${h(cust.name)} ${cust.table?'Table '+h(cust.table):''}<hr>${b.L.map(l=>`<div class="ln"><span>${h(l.n)} x${l.q}</span><span>${money(l.a)}</span></div>`).join('')}<div class="ln"><span>Subtotal</span><span>${money(b.sub)}</span></div>${b.gs.filter(x=>x.r).map(x=>`<div class="ln"><span>CGST ${x.r/2}%</span><span>${money(x.c)}</span></div><div class="ln"><span>SGST ${x.r/2}%</span><span>${money(x.c)}</span></div>`).join('')}<div class="ln"><b>TOTAL</b><b>${money(b.tot)}</b></div><p style="text-align:center">Thank you, visit again!</p>`;window.print()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-v],[data-a],[data-fc]');if(!t)return;const id=t.dataset.id,a=t.dataset.a;
if(t.dataset.fc){fc=t.dataset.fc;return render()}if(t.dataset.v){view=t.dataset.v;if(view==='bill')await loadBills();return render()}
if(a==='own')return toast('Open this page signed in to the owner’s Claude account to unlock.');
if(a==='pub')return pub();
if(a==='add'){D.menu.unshift({id:'m'+Date.now(),name:'New item',cat:'Starters',price:0,gst:5,nv:0,desc:'',img:''});dirty=true}
if(a==='del'){D.menu=D.menu.filter(m=>m.id!==id);dirty=true}
if(a==='gdel'){D.gallery.splice(+id,1);dirty=true}if(a==='rdel'){D.reviews.splice(+id,1);dirty=true}
if(a==='radd'){const t=$('#rt').value.trim();if(!t)return;D.reviews.push({n:$('#rn').value||'Guest',r:Math.min(5,Math.max(1,+$('#rr').value||5)),t});dirty=true}
if(a==='add2'){const m=D.menu.find(x=>x.id===id);if(!m.price)return toast('Set a price in the Menu tab first');cust={name:$('#cn')?.value||'',table:$('#ct')?.value||''};cart[id]=(cart[id]||0)+1}
if(a==='dec'){cart[id]--}if(a==='clear')cart={};
if(a==='paid'){cust={name:$('#cn').value,table:$('#ct').value};const b=calc();if(!b.L.length)return;const no='INV-'+Date.now().toString().slice(-6);
try{const db=await claude.use('db');await db.collection('bills').add({t:Date.now(),no,cust:cust.name,table:cust.table,total:b.tot,tax:b.tax,lines:b.L});print(b,no);cart={};cust={name:'',table:''};await loadBills()}catch(x){return toast('Could not save bill')}}
render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#mg').innerHTML=mg()}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
if(d.f){const m=D.menu.find(x=>x.id===d.id);m[d.f]=['price','gst','nv'].includes(d.f)?+t.value:t.value;dirty=true;return render()}
if(d.s){D[d.s]=t.value;dirty=true;return render()}
try{if(d.up&&t.files[0]){D.menu.find(x=>x.id===d.up).img=(await up(t.files[0])).url;dirty=true;render()}
if(d.bulk){toast('Uploading…');let n=0;for(const f of t.files){const tok=f.name.replace(/\.[^.]+$/,'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);const ms=D.menu.filter(m=>tok.length&&tok.every(w=>m.name.toLowerCase().includes(w)));if(!ms.length)continue;const u=(await up(f)).url;ms.forEach(m=>m.img=u);n+=ms.length}dirty=true;render();toast(n+' dishes updated')}
if(d.hero&&t.files[0]){D.hero=(await up(t.files[0])).url;dirty=true;render()}
if(d.gal){for(const f of t.files){D.gallery.push({u:(await up(f)).url,t:f.type.startsWith('video')?'vid':'img'})}dirty=true;render()}}catch(x){toast('Upload failed (file too large or not permitted)')}});
render();
(async()=>{try{const u=await claude.use('user');owner=!!(u&&u.canEdit());render()}catch(e){}})();
</script>
</body></html>
